                <label class="text-xs font-bold text-amber-700 dark:text-amber-500">પસંદ કરેલ પેન્ડિંગ કીર્તન એડિટ કરો:</label>
                <input type="text" id="pending-title" class="w-full p-2 border border-amber-300 dark:border-slate-600 bg-white dark:bg-slate-700 font-bold text-amber-900 dark:text-amber-100 rounded-md focus:ring-2 focus:ring-amber-500 transition-colors" placeholder="કીર્તનનું નામ">

                <div class="flex gap-2 shrink-0">

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        Go Live
                    </button>

    </div>

    <script>
        const MIN_SPLIT_LEN = 0;

        // --- 0. Theme Initialization & Toggle ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-icon-dark');
        const lightIcon = document.getElementById('theme-icon-light');
        const htmlElement = document.documentElement;
        let ledWin = null;

        function sendToLED(msg) {
            if (ledWin && !ledWin.closed) {
                try { ledWin.postMessage(Object.assign({ kirtanLed: true }, msg), '*'); } catch (e) {}
            }
        }

        function updateThemeUI() {
            if (htmlElement.classList.contains('dark')) {
                darkIcon.classList.add('hidden');
                lightIcon.classList.remove('hidden');
            } else {
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
            localStorage.setItem('kirtan_led_theme', 'dark');
        } else {
            htmlElement.classList.remove('dark');
            localStorage.setItem('kirtan_led_theme', 'light');
        }
        updateThemeUI();

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.add('theme-transition-disable');
            
            htmlElement.classList.toggle('dark');
            const t = htmlElement.classList.contains('dark') ? 'dark' : 'light';
            localStorage.setItem('theme', t);
            localStorage.setItem('kirtan_led_theme', t);
            sendToLED({ type: 'theme', theme: t });
            updateThemeUI();
            
            void htmlElement.offsetHeight;
            
            setTimeout(() => {
                htmlElement.classList.remove('theme-transition-disable');
            }, 50);
        });


        // --- 1. Gujarati → Roman ---
        const LONG_A = false;
        const G_CONS = {'ક':'k','ખ':'kh','ગ':'g','ઘ':'gh','ઙ':'ng','ચ':'ch','છ':'chh','જ':'j','ઝ':'jh','ઞ':'ny','ટ':'t','ઠ':'th','ડ':'d','ઢ':'dh','ણ':'n','ત':'t','થ':'th','દ':'d','ધ':'dh','ન':'n','પ':'p','ફ':'f','બ':'b','ભ':'bh','મ':'m','ય':'y','ર':'r','લ':'l','ળ':'l','વ':'v','શ':'sh','ષ':'sh','સ':'s','હ':'h'};
        const G_VOW = {'અ':'a','આ':LONG_A?'aa':'a','ઇ':'i','ઈ':'ee','ઉ':'u','ઊ':'oo','ઋ':'ru','ઍ':'e','એ':'e','ઐ':'ai','ઑ':'o','ઓ':'o','ઔ':'au'};
        const G_MATRA = {'ા':LONG_A?'aa':'a','િ':'i','ી':'ee','ુ':'u','ૂ':'oo','ૃ':'ru','ૅ':'e','ે':'e','ૈ':'ai','ૉ':'o','ો':'o','ૌ':'au'};
        const G_DIGIT = {'૦':'0','૧':'1','૨':'2','૩':'3','૪':'4','૫':'5','૬':'6','૭':'7','૮':'8','૯':'9'};
        const G_EXC = {'શ્રી':'shree', 'શ્રીજી':'shreeji', 'સ્વામિનારાયણ':'swaminarayan', 'ભગવાન':'bhagwan', 'જય':'jay', 'મહારાજ':'maharaj', 'હરિ':'hari', 'કૃષ્ણ':'krishna', 'ઘનશ્યામ':'ghanshyam', 'સહજાનંદ':'sahajanand'};

        function gujWord(word) {
            word = word.replace(/[\u200C\u200D\u0ABC]/g, '');
            if (!word) return '';
            if (G_EXC[word]) return G_EXC[word];

            const chars = [...word], syl = [];
            let cl = [];
            for (let i = 0; i < chars.length; i++) {
                const ch = chars[i], nx = chars[i + 1];
                if (G_CONS[ch] !== undefined) {
                    let r = G_CONS[ch];
                    if (ch === 'વ' && cl[cl.length - 1] === 's') r = 'w';
                    if (ch === 'ઞ' && cl[cl.length - 1] === 'j') { cl.pop(); r = 'gn'; }
                    cl.push(r);
                    if (nx === '્') { i++; continue; }
                    if (G_MATRA[nx] !== undefined) { syl.push({ cs: cl, v: G_MATRA[nx], fixed: true }); i++; }
                    else syl.push({ cs: cl, v: 'a', fixed: false });
                    cl = [];
                } else if (G_VOW[ch] !== undefined) {
                    syl.push({ cs: [], v: G_VOW[ch], fixed: true });
                } else if (ch === 'ં' || ch === 'ઁ') {
                    const s = syl[syl.length - 1];
                    if (s) { s.coda = 'પફબભમ'.includes(nx || '#') ? 'm' : 'n'; s.fixed = true; }
                } else if (ch === 'ઃ') {
                    const s = syl[syl.length - 1];
                    if (s) { s.coda = 'h'; s.fixed = true; }
                } else if (G_DIGIT[ch] !== undefined) {
                    syl.push({ cs: [], v: G_DIGIT[ch], fixed: true });
                }
            }
            if (cl.length) syl.push({ cs: cl, v: '', fixed: true });

            const n = syl.length;
            for (let i = n - 1; i >= 0; i--) {
                const s = syl[i];
                if (s.fixed || s.v !== 'a' || !s.cs.length) continue;
                if (i === n - 1) {
                    if (n === 1) continue;
                    const last = s.cs[s.cs.length - 1];
                    if (s.cs.length > 1 && ['r', 'y', 'v', 'w'].includes(last)) continue;
                    s.v = '';
                } else if (i > 0 && syl[i - 1].v !== '' && syl[i + 1].v !== '') {
                    s.v = '';
                }
            }
            return syl.map(s => s.cs.join('') + s.v + (s.coda || '')).join('');
        }

        function transliterate(str) {
            if (!str) return '';
            const out = str.replace(/[\u0A80-\u0AFF\u200C\u200D]+/g, w => gujWord(w));
            return out.charAt(0).toUpperCase() + out.slice(1);
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // --- 2. State & Variables ---
        let parsedKirtans = [];
        let liveIndex = -1;

        let pendingQueue = [];
        let selectedQueueIndex = -1;

        let currentSlides = [];
        let currentSlideIndex = 0;
        let slideCache = [];

        // Elements
        const listContainer = document.getElementById('kirtan-list');
        const searchInput = document.getElementById('search-input');
        const liveTitle = document.getElementById('live-title');
        const liveContent = document.getElementById('live-content');
        const pendingTitle = document.getElementById('pending-title');
        const pendingContent = document.getElementById('pending-content');
        const slideStatus = document.getElementById('slide-status');


        // --- 3. Auto-Load & GitHub API Save ---
        function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
        function base64ToUtf8(str) { return decodeURIComponent(escape(atob(str))); }

        // પેજ લોડ થતાં જ ઓટોમેટિક કીર્તનો લાવવા માટે
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // cache busting ઉમેર્યું છે જેથી હંમેશા લેટેસ્ટ ફાઈલ જ લોડ થાય
                const response = await fetch('kirtans.txt?t=' + new Date().getTime());
                if(response.ok) {
                    const text = await response.text();
                    parseFile(text);
                } else {
                    throw new Error('File not found');
                }
            } catch(e) {
                console.error(e);
                listContainer.innerHTML = '<div class="text-center text-red-500 mt-10">kirtans.txt ફાઇલ મળી નથી.<br>ગિટહબ પર અપલોડ કરેલી છે કે નહીં તે ચકાસો.</div>';
            }
        });

        // સેટિંગ્સ માટે
        document.getElementById('github-settings-btn').addEventListener('click', () => {
            const user = prompt("તમારું GitHub Username નાખો (દા.ત. rahul123):", localStorage.getItem('gh_user') || '');
            const repo = prompt("તમારા Repository નું નામ નાખો (દા.ત. kirtan-controller):", localStorage.getItem('gh_repo') || '');
            const token = prompt("તમારો GitHub Personal Access Token (PAT) નાખો:\n(આ તમારા જ બ્રાઉઝરમાં સુરક્ષિત રહેશે)", localStorage.getItem('gh_token') || '');
            
            if(user !== null) localStorage.setItem('gh_user', user.trim());
            if(repo !== null) localStorage.setItem('gh_repo', repo.trim());
            if(token !== null) localStorage.setItem('gh_token', token.trim());
            alert('સેટિંગ્સ સેવ થઈ ગયા છે!');
        });

        // ગિટહબ પર સીધું સેવ કરવાનું ફંક્શન
        document.getElementById('save-github-btn').addEventListener('click', async () => {
            const ghUser = localStorage.getItem('gh_user');
            const ghRepo = localStorage.getItem('gh_repo');
            const ghToken = localStorage.getItem('gh_token');
            
            if(!ghUser || !ghRepo || !ghToken) {
                alert('કૃપા કરીને પહેલા "⚙️ સેટિંગ્સ" માં જઈને ગિટહબની માહિતી ભરો.'); return;
            }
            
            if (parsedKirtans.length === 0) {
                alert('કોઈ કીર્તન સેવ કરવા માટે નથી!'); return;
            }
            
            if (liveIndex !== -1) {
                parsedKirtans[liveIndex].title = liveTitle.value;
                parsedKirtans[liveIndex].content = liveContent.value;
            }
            
            let outputStr = '';
            parsedKirtans.forEach(k => { outputStr += `Chapter_name - ${k.title}\n${k.content}\n\n`; });
            
            const btn = document.getElementById('save-github-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'સેવ થઈ રહ્યું છે... ☁️';
            
            try {
                const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/kirtans.txt`;
                
                // 1. ફાઇલનો લેટેસ્ટ SHA મેળવો
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${ghToken}` } });
                if (!getRes.ok) throw new Error('ગિટહબ સાથે કનેક્ટ થઈ શક્યું નથી. ચેક કરો કે Repo નામ અને Token સાચા છે.');
                const getData = await getRes.json();
                const currentSha = getData.sha;

                // 2. નવી ફાઇલ અપલોડ કરો
                const contentB64 = utf8ToBase64(outputStr);
                const body = {
                    message: 'Kirtan Controller દ્વારા કીર્તન અપડેટ કર્યા',
                    content: contentB64,
                    sha: currentSha
                };
                
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${ghToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (!putRes.ok) throw new Error('સેવ કરવામાં ભૂલ આવી.');
                
                btn.innerHTML = "✓ ગિટહબ પર સેવ થઈ ગયું!";
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                setTimeout(() => { btn.innerHTML = originalText; btn.classList.replace('bg-green-600', 'bg-blue-600'); }, 2000);
            } catch (error) {
                console.error(error);
                alert(error.message);
                btn.innerHTML = originalText;
            }
        });

        function parseFile(text) {
            parsedKirtans = [];
            liveIndex = -1;
            const parts = text.split('Chapter_name -');
            parts.forEach(part => {
                if (part.trim() === '') return;
                const lines = part.split('\n');
                let title = lines[0].trim();
                if(title.startsWith('-')) title = title.substring(1).trim();
                const content = lines.slice(1).join('\n').trim();
                if (title || content) parsedKirtans.push({ title: title || 'અજ્ઞાત', content: content });
            });
            renderList();
        }

        // --- 4. UI Rendering & Interactions ---
        const ITEM_BASE = 'border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700';
        const ITEM_ACTIVE = 'border-blue-500 border-l-4 bg-blue-50 dark:bg-blue-900/40 shadow-sm';

        let searchTimer = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderList, 180);
        });

        function renderList() {
            const term = searchInput.value.toLowerCase().trim();
            if (parsedKirtans.length === 0) { listContainer.innerHTML = ''; return; }

            const parts = [];
            for (let idx = 0; idx < parsedKirtans.length; idx++) {
                const kirtan = parsedKirtans[idx];
                if (!kirtan.title.toLowerCase().includes(term)) continue;
                parts.push(
                    '<div class="k-item p-3 rounded-md border ' + (idx === liveIndex ? ITEM_ACTIVE : ITEM_BASE) + ' transition-colors" data-idx="' + idx + '">' +
                        '<div class="k-title font-bold text-gray-800 dark:text-gray-100 mb-3">' + escapeHtml(kirtan.title) + '</div>' +
                        '<div class="flex gap-2">' +
                            '<button data-act="live" class="flex-1 py-1.5 bg-blue-100 dark:bg-blue-900/50 hover:bg-blue-600 dark:hover:bg-blue-600 hover:text-white dark:hover:text-white text-blue-700 dark:text-blue-300 font-bold rounded text-xs transition border border-blue-200 dark:border-blue-800 hover:border-blue-600 shadow-sm">🔴 Live</button>' +
                            '<button data-act="pending" class="flex-1 py-1.5 bg-amber-100 dark:bg-amber-900/50 hover:bg-amber-500 dark:hover:bg-amber-600 hover:text-white dark:hover:text-white text-amber-800 dark:text-amber-300 font-bold rounded text-xs transition border border-amber-200 dark:border-amber-800 hover:border-amber-500 shadow-sm">⏳ Pending</button>' +
                        '</div>' +
                    '</div>'
                );
            }
            listContainer.innerHTML = parts.join('');
        }

        listContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const item = btn.closest('[data-idx]');
            if (!item) return;
            const idx = parseInt(item.dataset.idx, 10);
            if (btn.dataset.act === 'live') setLiveDirectly(idx);
            else addToQueue(idx);
        });

        function styleItem(el, active) {
            if (!el) return;
            ITEM_BASE.split(' ').forEach(c => el.classList.remove(c));
            ITEM_ACTIVE.split(' ').forEach(c => el.classList.remove(c));
            (active ? ITEM_ACTIVE : ITEM_BASE).split(' ').forEach(c => el.classList.add(c));
        }

        function setLiveHighlight(newIdx) {
            if (liveIndex !== -1) styleItem(listContainer.querySelector('[data-idx="' + liveIndex + '"]'), false);
            liveIndex = newIdx;
            if (liveIndex !== -1) styleItem(listContainer.querySelector('[data-idx="' + liveIndex + '"]'), true);
        }

        // --- Queue System (Right Column) ---
        function addToQueue(idx) {
            const k = parsedKirtans[idx];
            pendingQueue.push({ originalIndex: idx, title: k.title, content: k.content });
            selectedQueueIndex = pendingQueue.length - 1;
            renderQueue();
        }

        function renderQueue() {
            const qList = document.getElementById('pending-queue-list');
            document.getElementById('queue-count').innerText = pendingQueue.length;

            if (pendingQueue.length === 0) {
                qList.innerHTML = `<div class="text-xs text-gray-400 dark:text-slate-500 text-center mt-4">કતારમાં કોઈ કીર્તન નથી.<br>ડાબી બાજુથી 'Pending' બટન દબાવીને ઉમેરો.</div>`;
                pendingTitle.value = ''; pendingContent.value = ''; selectedQueueIndex = -1; return;
            }

            qList.innerHTML = '';
            pendingQueue.forEach((item, qIdx) => {
                const isSelected = qIdx === selectedQueueIndex;
                const div = document.createElement('div');
                const styleClasses = isSelected
                    ? 'bg-amber-100 dark:bg-amber-900/60 border-amber-400 dark:border-amber-500'
                    : 'bg-white dark:bg-slate-800 border-amber-100 dark:border-slate-600 hover:bg-amber-50 dark:hover:bg-slate-700';

                div.className = `flex justify-between items-center p-2 rounded cursor-pointer border transition-colors ${styleClasses}`;
                div.innerHTML = `
                    <span class="font-semibold text-sm truncate w-4/5 select-none text-amber-900 dark:text-amber-100" onclick="selectQueueItem(${qIdx})">${escapeHtml(item.title)}</span>
                    <button class="text-red-400 dark:text-red-500 hover:text-red-600 dark:hover:text-red-400 font-bold text-lg leading-none px-2" onclick="removeFromQueue(${qIdx}, event)">×</button>
                `;
                qList.appendChild(div);
            });

            if (selectedQueueIndex !== -1 && pendingQueue[selectedQueueIndex]) {
                pendingTitle.value = pendingQueue[selectedQueueIndex].title;
                pendingContent.value = pendingQueue[selectedQueueIndex].content;
            }
        }

        window.selectQueueItem = function(qIdx) { selectedQueueIndex = qIdx; renderQueue(); }
        window.removeFromQueue = function(qIdx, event) {
            if(event) event.stopPropagation();
            pendingQueue.splice(qIdx, 1);
            if (selectedQueueIndex === qIdx) { selectedQueueIndex = pendingQueue.length > 0 ? 0 : -1; }
            else if (selectedQueueIndex > qIdx) { selectedQueueIndex--; }
            renderQueue();
        }

        document.getElementById('save-pending-btn').addEventListener('click', () => {
            if (selectedQueueIndex === -1) return;
            const newTitle = pendingTitle.value; const newContent = pendingContent.value;
            pendingQueue[selectedQueueIndex].title = newTitle; pendingQueue[selectedQueueIndex].content = newContent;
            const origIdx = pendingQueue[selectedQueueIndex].originalIndex;
            parsedKirtans[origIdx].title = newTitle; parsedKirtans[origIdx].content = newContent;
            renderQueue();
            const el = listContainer.querySelector('[data-idx="' + origIdx + '"] .k-title');
            if (el) el.textContent = newTitle;

            const btn = document.getElementById('save-pending-btn'); const oldText = btn.innerHTML;
            btn.innerHTML = "✓ સેવ થઈ ગયું";
            btn.classList.replace('bg-amber-100', 'bg-green-100'); btn.classList.replace('dark:bg-slate-700', 'dark:bg-green-800');
            btn.classList.replace('dark:text-amber-200', 'dark:text-white');
            setTimeout(() => {
                btn.innerHTML = oldText;
                btn.classList.replace('bg-green-100', 'bg-amber-100'); btn.classList.replace('dark:bg-green-800', 'dark:bg-slate-700');
                btn.classList.replace('dark:text-white', 'dark:text-amber-200');
            }, 1500);
        });

        document.getElementById('make-live-btn').addEventListener('click', () => {
            if (selectedQueueIndex === -1) return;
            const item = pendingQueue[selectedQueueIndex];
            liveTitle.value = item.title; liveContent.value = item.content;
            setLiveHighlight(item.originalIndex);
            generateSlides(true); removeFromQueue(selectedQueueIndex, null);
        });

        function setLiveDirectly(idx) {
            liveTitle.value = parsedKirtans[idx].title; liveContent.value = parsedKirtans[idx].content;
            setLiveHighlight(idx);
            generateSlides(true);
        }

        // --- 5. Slide Generation & LED Push ---
        function splitLongLine(line) {
            if (line.length < MIN_SPLIT_LEN) return [line];
            const pieces = line.split(/(?<=[,;:])\s*/).map(p => p.trim()).filter(p => p !== '');
            return pieces.length ? pieces : [line];
        }

        function generateSlides(resetIndex = false) {
            const title = liveTitle.value; const text = liveContent.value;
            currentSlides = []; currentSlides.push(title);
            slideCache = [];
            const rawLines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
            const lines = [];
            rawLines.forEach(l => { splitLongLine(l).forEach(p => lines.push(p)); });
            for (let i = 0; i < lines.length; i += 2) {
                let slideText = lines[i];
                if (i + 1 < lines.length) slideText += '\n' + lines[i + 1];
                currentSlides.push(slideText);
            }
            if (resetIndex) { currentSlideIndex = 0; }
            else { currentSlideIndex = Math.min(currentSlideIndex, Math.max(0, currentSlides.length - 1)); }
            pushToLED();
        }

        document.getElementById('update-live-btn').addEventListener('click', () => {
            if (liveIndex !== -1) { parsedKirtans[liveIndex].title = liveTitle.value; parsedKirtans[liveIndex].content = liveContent.value; }
            generateSlides(false);
        });

        function buildSlideHtml(slideText) {
            const lines = slideText.split('\n');
            let gujHtml = ''; let engHtml = '';
            lines.forEach(line => {
                if(line.trim() !== '') {
                    const guj = escapeHtml(line); const eng = escapeHtml(transliterate(line));
                    gujHtml += `<div class="guj-text text-fit">${guj}</div>`;
                    engHtml += `<div class="eng-text text-fit">${eng}</div>`;
                }
            });
            return `
                <div class="lang-block">
                    ${gujHtml}
                </div>
                <div class="divider"></div>
                <div class="lang-block">
                    ${engHtml}
                </div>`;
        }

        function pushToLED() {
            if (currentSlides.length === 0) { slideStatus.textContent = `0 / 0`; return; }
            slideStatus.textContent = `${currentSlideIndex + 1} / ${currentSlides.length}`;
            if (!slideCache[currentSlideIndex]) slideCache[currentSlideIndex] = buildSlideHtml(currentSlides[currentSlideIndex]);
            const htmlContent = slideCache[currentSlideIndex];
            const ts = Date.now();

            sendToLED({ type: 'state', html: htmlContent, timestamp: ts });

            try {
                localStorage.setItem('kirtan_led_state', JSON.stringify({ html: htmlContent, timestamp: ts }));
            } catch (e) {}
        }

        document.getElementById('prev-btn').addEventListener('click', () => { if (currentSlideIndex > 0) { currentSlideIndex--; pushToLED(); }});
        document.getElementById('next-btn').addEventListener('click', () => { if (currentSlideIndex < currentSlides.length - 1) { currentSlideIndex++; pushToLED(); }});
        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('next-btn').click(); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); document.getElementById('prev-btn').click(); }
        });

        // --- 6. Extended Display API & LED Window ---
        document.getElementById('open-led-btn').addEventListener('click', async () => {
            let winFeatures = 'width=1280,height=720';

            if ('getScreenDetails' in window) {
                try {
                    const screenDetails = await window.getScreenDetails();
                    const extScreen = screenDetails.screens.find(s => s !== screenDetails.currentScreen);
                    if (extScreen) {
                        winFeatures = `left=${extScreen.availLeft},top=${extScreen.availTop},width=${extScreen.availWidth},height=${extScreen.availHeight}`;
                    }
                } catch (err) {
                    console.warn("Screen Details API permission denied or failed. Using fallback.", err);
                }
            }

            ledWin = window.open('', 'LEDWindow', winFeatures);
            if(!ledWin) { alert("પોપ-અપ બ્લોક થયેલ છે. કૃપા કરીને બ્રાઉઝરમાં પોપ-અપ મંજૂરી આપો."); return; }

            ledWin.document.open();
            ledWin.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Kirtan LED View</title>
                    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@700&display=swap" rel="stylesheet">
                    <style>
                        body {
                            margin: 0; padding: 0; height: 100vh; width: 100vw;
                            display: flex; flex-direction: column; justify-content: center; align-items: center;
                            overflow: hidden; cursor: default; transition: background-color 0.5s;
                        }
                        .content-wrapper {
                            width: 95%; display: flex; flex-direction: column;
                            align-items: center; gap: 4vh;
                        }
                        .lang-block {
                            display: flex; flex-direction: column; align-items: center; width: 100%; gap: 1.5vh;
                        }
                        .text-fit {
                            white-space: nowrap; text-align: center;
                            width: max-content; line-height: 1.25;
                        }
                        .guj-text { font-family: 'Bhujmandir Hari', 'Noto Sans Gujarati', sans-serif; font-weight: 700; }
                        .eng-text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
                        .divider {
                            width: 80%; height: 2px; border-radius: 50%;
                        }
                        .fs-hint {
                            position: absolute; top: 10px; right: 10px; font-family: sans-serif; font-size: 12px;
                            padding: 5px 10px; border-radius: 4px; pointer-events: none; transition: opacity 0.5s;
                        }

                        body.dark-theme { background-color: #000000; }
                        body.dark-theme .guj-text { color: #ffffff; }
                        body.dark-theme .eng-text { color: #fbbf24; }
                        body.dark-theme .divider { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); }
                        body.dark-theme .fs-hint { color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.2); }

                        body.light-theme { background-color: #ffffff; }
                        body.light-theme .guj-text { color: #1e3a8a; }
                        body.light-theme .eng-text { color: #c2410c; }
                        body.light-theme .divider { background: linear-gradient(90deg, transparent, rgba(0,0,0,0.2), transparent); }
                        body.light-theme .fs-hint { color: rgba(0,0,0,0.3); border: 1px solid rgba(0,0,0,0.2); }
                    </style>
                </head>
                <body class="dark-theme">
                    <div class="fs-hint" id="fs-hint">Double Click to Fullscreen</div>
                    <div class="content-wrapper" id="display-area">
                        <div class="lang-block">
                            <div class="guj-text text-fit">શ્રી સ્વામિનારાયણ ભગવાનની જય</div>
                        </div>
                        <div class="divider"></div>
                        <div class="lang-block">
                            <div class="eng-text text-fit">Shree Swaminarayan Bhagwanni Jay</div>
                        </div>
                    </div>

                    <script>
                        document.body.addEventListener('dblclick', function () {
                            if (!document.fullscreenElement) {
                                document.documentElement.requestFullscreen().catch(function (err) {
                                    console.log("Error attempting to enable fullscreen:", err);
                                });
                            } else { document.exitFullscreen(); }
                        });

                        setTimeout(function () {
                            var hint = document.getElementById('fs-hint');
                            if (hint) hint.style.opacity = '0';
                        }, 5000);

                        function applyTheme(themeName) {
                            if (themeName === 'light') {
                                document.body.classList.remove('dark-theme');
                                document.body.classList.add('light-theme');
                            } else {
                                document.body.classList.remove('light-theme');
                                document.body.classList.add('dark-theme');
                            }
                        }
                        applyTheme(localStorage.getItem('kirtan_led_theme') || 'dark');

                        function fitText() {
                            var area = document.getElementById('display-area');
                            var maxW = window.innerWidth * 0.94, maxH = window.innerHeight * 0.92;
                            var guj = [].slice.call(area.querySelectorAll('.guj-text'));
                            var eng = [].slice.call(area.querySelectorAll('.eng-text'));

                            function best(els, cap) {
                                if (!els.length) return 0;
                                els.forEach(function (e) { e.style.fontSize = '100px'; });
                                var w = 0;
                                els.forEach(function (e) { if (e.scrollWidth > w) w = e.scrollWidth; });
                                if (!w) return 10;
                                var s = Math.floor(100 * maxW / w);
                                return Math.max(10, Math.min(s, Math.floor(cap)));
                            }
                            var g = best(guj, window.innerHeight * 0.35);
                            var e = best(eng, window.innerHeight * 0.28);
                            function apply() {
                                guj.forEach(function (x) { x.style.fontSize = g + 'px'; });
                                eng.forEach(function (x) { x.style.fontSize = e + 'px'; });
                            }
                            apply();
                            
                            var guard = 0;
                            while (guard++ < 8 && guj.concat(eng).some(function (x) { return x.scrollWidth > maxW; })) {
                                g = Math.max(10, Math.floor(g * 0.97)); e = Math.max(10, Math.floor(e * 0.97)); apply();
                            }
                            var h = area.getBoundingClientRect().height;
                            if (h > maxH) { var f = maxH / h; g = Math.floor(g * f); e = Math.floor(e * f); apply(); }
                        }

                        var lastTs = 0;
                        function render(html, ts) {
                            if (ts && ts <= lastTs) return;
                            if (ts) lastTs = ts;
                            document.getElementById('display-area').innerHTML = html;
                            requestAnimationFrame(fitText);
                        }

                        window.addEventListener('message', function (ev) {
                            var d = ev.data;
                            if (!d || !d.kirtanLed) return;
                            if (d.type === 'state') render(d.html, d.timestamp);
                            if (d.type === 'theme') applyTheme(d.theme);
                        });

                        window.addEventListener('storage', function (e) {
                            if (e.key === 'kirtan_led_state' && e.newValue) {
                                var state = JSON.parse(e.newValue);
                                render(state.html, state.timestamp);
                            }
                            if (e.key === 'kirtan_led_theme' && e.newValue) {
                                applyTheme(e.newValue);
                            }
                        });

                        var rzTimer = null;
                        window.addEventListener('resize', function () {
                            clearTimeout(rzTimer);
                            rzTimer = setTimeout(fitText, 120);
                        });
                        requestAnimationFrame(fitText);
                        document.fonts.ready.then(fitText);
                    <\/script>
                </body>
                </html>
            `);
            ledWin.document.close();

            setTimeout(() => {
                sendToLED({ type: 'theme', theme: htmlElement.classList.contains('dark') ? 'dark' : 'light' });
                if (currentSlides.length) pushToLED();
            }, 150);
        });
    </script>
</body>
</html>
